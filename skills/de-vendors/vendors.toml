# Official vendor skill repos, pinned to a full commit SHA.
# Bumping a sha is a reviewed change: diff the vendor repo between the old and new sha first.
# `roots` are the directories searched for */SKILL.md. `cli`/`mcp` lines are PRINTED for the
# human to review and run; de-vendors never executes them.
# Resolved 2026-11-09.

[vendor.dbt]
repo = "dbt-labs/dbt-agent-skills"
sha = "b8facde20b7a92c40ce3e6b86b71c4b92aa44040"
license = "Apache-2.0"
roots = ["skills"]
cli = "dbt v2 engine: see https://docs.getdbt.com (dbt Core v1 stays pip: uv tool install dbt-core==<pinned>)"
mcp = "dbt MCP, local: uvx dbt-mcp==<pinned>  (https://github.com/dbt-labs/dbt-mcp)"

[vendor.astronomer]
repo = "astronomer/agents"
sha = "35b9610bb2710c37ca11326c4cbf7818b6725fec"
license = "Apache-2.0"
roots = ["skills"]
cli = "astro CLI: brew install astro, or a release binary from https://github.com/astronomer/astro-cli/releases"
mcp = "astro-airflow-mcp, local, lives in the same repo: https://github.com/astronomer/agents"

[vendor.databricks]
