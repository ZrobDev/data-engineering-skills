# MCP-only (no official skills found 2026-11-09). Printed by `pull_vendor.py info`.
[mcp_only]
bigquery = "MCP Toolbox for Databases (Go binary, ADC auth): https://github.com/googleapis/genai-toolbox.  CLI: gcloud + bq from the Google Cloud SDK"
tableau = "Tableau MCP: https://github.com/tableau/tableau-mcp  (Node package: install pinned with pnpm, never npx)"
confluent = "Confluent MCP: https://github.com/confluentinc/mcp-confluent  (API key; Node)"
fivetran = "Fivetran MCP: https://github.com/fivetran/fivetran-mcp  (API key)"
