# Gates for a public skills repo. Every tool is pinned: actions by SHA, binaries by
# checksum, Python tools by exact version. gitleaks and zizmor jobs are copied from the
# owner's private devops-pipeline/security.yml (a public repo cannot call a private
# reusable workflow); keep them in lockstep with it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"   # gitleaks_8.30.1_linux_x64.tar.gz
  ZIZMOR_VERSION: "1.30.0"
  SKILL_SCANNER_VERSION: "2.3.2"

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Content lint (plain text, no pipe-to-shell, no blobs, URL allowlist, size caps)
        run: python3 scripts/lint_content.py
      - name: Structure (frontmatter, manifest, CHANGELOG parity, vendor pins)
        run: python3 scripts/validate.py
      - name: Guard tests + puller selftest
        run: |
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pyc" python3 -m unittest discover -s tests -v
          python3 skills/de-vendors/scripts/pull_vendor.py selftest

  skill-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv tool install "cisco-ai-skill-scanner==${SKILL_SCANNER_VERSION}"
      - name: Scan every skill (fails on high or critical)
        run: skill-scanner scan-all skills --recursive --use-behavioral --fail-on-severity high

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified release binary)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan full history
        run: |
          set +e
          # 42 = findings; any other non-zero is a scan error, which must not read as clean.
          gitleaks git --no-banner --redact --exit-code 42 .
          rc=$?; set -e
          [ "$rc" -eq 0 ] || { echo "::error::gitleaks exited $rc"; exit 1; }

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}   # online audits: known-vulnerable-actions, impostor-commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx install "zizmor==${ZIZMOR_VERSION}"
      - run: zizmor --min-severity medium --format plain --color never .github/workflows/
